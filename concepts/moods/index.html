<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Moods</title><link rel="icon" href="data:,"><style>body{margin:0;background:#111;color:#eee;font:18px/1.4 system-ui,sans-serif;padding:24px}h1{font-size:22px;font-weight:600;margin:0 0 6px}p{margin:0 0 20px;color:#aaa}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:22px}figure{margin:0}img{width:100%;display:block;border:1px solid #333}figcaption{margin-top:8px;font-size:20px}b{color:#7fe0a0;margin-right:.4em}</style></head><body><h1>Which of these makes you lean in?</h1><p>Feelings only. Nothing here gets copied; the winner sets the mood for an original design.</p><div class="g">

<figure><img src="m2.png" alt="Mood 2"><figcaption><b>2</b>One precious object, few words</figcaption></figure>
<figure><img src="m3.png" alt="Mood 3"><figcaption><b>3</b>3D, futuristic, immersive</figcaption></figure>
<figure><img src="m4.png" alt="Mood 4"><figcaption><b>4</b>Cinematic, quiet, mysterious</figcaption></figure>
<figure><img src="m5.png" alt="Mood 5"><figcaption><b>5</b>Loud, technical, red and black</figcaption></figure>
<figure><img src="m6.png" alt="Mood 6"><figcaption><b>6</b>Personal, name as a banner</figcaption></figure>
<figure><img src="m7.png" alt="Mood 7"><figcaption><b>7</b>Collage of typefaces, playful</figcaption></figure>
<figure><img src="m8.png" alt="Mood 8"><figcaption><b>8</b>Edgy, confident, dark</figcaption></figure>
<figure><img src="m9.png" alt="Mood 9"><figcaption><b>9</b>Pure visual, almost no words</figcaption></figure>
<figure><img src="m10.png" alt="Mood 10"><figcaption><b>10</b>Soft, dreamlike, elegant</figcaption></figure>
<figure><img src="m11.png" alt="Mood 11"><figcaption><b>11</b>Calm product, image first</figcaption></figure>
<figure><img src="m12.png" alt="Mood 12"><figcaption><b>12</b>Dense texture of names</figcaption></figure>
<figure><img src="m13.png" alt="Mood 13"><figcaption><b>13</b>Gateway, enter the site</figcaption></figure>
<figure><img src="m14.png" alt="Mood 14"><figcaption><b>14</b>Plain text, quietly expert</figcaption></figure>
